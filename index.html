<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawrsawti Publication Pvt. Ltd. - Ops Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#2557D6', // Match the login screen blue
                            dark: '#1e40af',
                            light: '#eff6ff'
                        },
                        sidebar: '#fbfbfb',
                        background: '#f6f6f5'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f6f6f5; color: #111827; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Utility classes for CSS charts */
        .chart-doughnut {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chart-doughnut::before {
            content: "";
            position: absolute;
            width: 70%;
            height: 70%;
            background-color: white;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Exposing Firebase globally for React (Babel) to consume seamlessly
        window.FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp };
    </script>

    <script type="text/babel">
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>,
            Inventory: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>,
            Requests: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Search: () => <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            ChevronDown: () => <svg className="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>,
            Refresh: () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>,
            Upload: () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        };

        const Modal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col animate-fade-in border border-gray-100">
                    <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                        <h3 className="font-bold text-gray-900">{title}</h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-red-50">
                            <Icons.Close />
                        </button>
                    </div>
                    <div className="p-6 overflow-y-auto max-h-[80vh]">
                        {children}
                    </div>
                </div>
            </div>
        );

        const LoginScreen = ({ onLogin }) => {
            return (
                <div className="flex h-screen w-full bg-[#f6f6f5]">
                    <div className="w-1/3 bg-[#2557D6] text-white flex flex-col justify-between p-12 hidden md:flex">
                        <div>
                            <div className="flex items-center gap-3 mb-16">
                                <div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center font-bold text-sm">SP</div>
                                <span className="font-semibold text-lg tracking-wide">Sawrsawti Publication Pvt. Ltd.</span>
                            </div>
                            
                            <h1 className="text-5xl font-bold mb-6 leading-tight">
                                Ops<br/>Dashboard
                            </h1>
                            <p className="text-white/80 text-lg max-w-sm mb-12">
                                Internal operations platform for managing SKU inventory, sample requests, and real-time live order fulfillment.
                            </p>

                            <div className="space-y-4">
                                {['Real-time live syncing', 'Cloud persistence', 'Order management'].map((item, i) => (
                                    <div key={i} className="flex items-center gap-3 text-white/90">
                                        <div className="w-5 h-5 rounded-full border border-white/30 flex items-center justify-center">
                                            <Icons.Check />
                                        </div>
                                        {item}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="text-white/50 text-sm">
                            © 2026 Sawrsawti Publication Pvt. Ltd.
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col justify-center items-center p-8">
                        <div className="w-full max-w-md">
                            <h2 className="text-3xl font-bold text-gray-900 mb-2">Sign in to Live Ops</h2>
                            <p className="text-gray-500 mb-8">Access the secure CRM dashboard</p>

                            <form onSubmit={(e) => { e.preventDefault(); onLogin(); }} className="space-y-6">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
                                    <input 
                                        type="email" 
                                        defaultValue="rohit.ops@saraswatipublication.com"
                                        className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all"
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full bg-[#2557D6] hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-sm"
                                >
                                    Login Securely
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ requests }) => {
            // Live Calculations based on real Firestore data
            const total = requests.length;
            const awaiting = requests.filter(r => r.status === 'ZM PENDING').length;
            const processing = requests.filter(r => ['OPS APPROVED', 'ORDER PROCESSING', 'B2B APP UPLOADED'].includes(r.status)).length;
            const dispatched = requests.filter(r => r.status === 'DISPATCHED').length;
            const delivered = requests.filter(r => r.status === 'DELIVERED').length;

            return (
                <div className="space-y-8 animate-fade-in pb-10">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900">Live Dashboard</h2>
                            <p className="text-gray-500 text-sm mt-1">Real-time operational overview connected to Cloud</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        {[
                            { label: 'TOTAL ORDERS', val: total, sub: 'All-time' },
                            { label: 'AWAITING OPS', val: awaiting, sub: 'ZM Pending', color: 'text-brand-blue' },
                            { label: 'PROCESSING', val: processing, sub: 'In B2B / Ops', color: 'text-purple-600' },
                            { label: 'DISPATCHED', val: dispatched, sub: 'In transit', color: 'text-orange-500' }
                        ].map((stat, i) => (
                            <div key={i} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                <p className="text-xs font-bold text-gray-500 uppercase">{stat.label}</p>
                                <h3 className={`text-4xl font-bold mt-2 mb-1 ${stat.color || 'text-gray-900'}`}>{stat.val}</h3>
                                <p className="text-xs text-gray-400">{stat.sub}</p>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest w-full text-left mb-6">Pipeline Health</h3>
                            <div className="chart-doughnut w-48 h-48" style={{ background: total > 0 ? 'conic-gradient(#10b981 0% 65%, #f59e0b 65% 90%, #f97316 90% 100%)' : '#e5e7eb' }}>
                                <div className="absolute inset-4 bg-white rounded-full flex flex-col items-center justify-center shadow-inner">
                                    <span className="text-3xl font-bold text-gray-900">{total}</span>
                                    <span className="text-xs font-bold text-gray-400 uppercase tracking-wide">Orders</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center justify-center col-span-2 text-center text-gray-500">
                            <Icons.Dashboard />
                            <p className="mt-4 font-medium">Add requests and SKUs to see live timeline distributions here.</p>
                        </div>
                    </div>
                </div>
            );
        };

        const SKUListView = ({ skus, onAddSKU, onUpdateStatus, onDelete }) => {
            const [showAdd, setShowAdd] = React.useState(false);
            const [formData, setFormData] = React.useState({ id: '', name: '', category: 'CBSE Class 10th', mrp: '', stock: '', status: 'ACTIVE' });

            const handleSubmit = (e) => {
                e.preventDefault();
                onAddSKU({
                    ...formData, 
                    mrp: Number(formData.mrp), 
                    stock: Number(formData.stock), 
                    credit: '38%', 
                    cash: '40%' 
                });
                setShowAdd(false);
                setFormData({ id: '', name: '', category: 'CBSE Class 10th', mrp: '', stock: '', status: 'ACTIVE' });
            };

            const getStatusColor = (status) => {
                if(status === 'ACTIVE') return 'bg-green-50 text-green-700 border-green-200';
                if(status === 'OUT OF STOCK') return 'bg-red-50 text-red-700 border-red-200';
                return 'bg-gray-100 text-gray-700 border-gray-200';
            };

            return (
                <div className="space-y-6 animate-fade-in pb-10">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-900">Live SKU Database</h2>
                        <button onClick={() => setShowAdd(true)} className="flex items-center px-4 py-2 bg-brand-blue text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm transition">
                            + Add New SKU
                        </button>
                    </div>

                    {showAdd && (
                        <Modal title="Add New Inventory SKU" onClose={() => setShowAdd(false)}>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">ERP Item ID</label>
                                    <input required value={formData.id} onChange={e => setFormData({...formData, id: e.target.value})} className="w-full p-2 border rounded" placeholder="e.g. ERP-ITEM-2026..." />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">Book Name</label>
                                    <input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded" placeholder="Full Title" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">Category</label>
                                        <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2 border rounded bg-white">
                                            <option>CBSE Class 10th</option>
                                            <option>CBSE Class 12th</option>
                                            <option>State Board</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">Status</label>
                                        <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full p-2 border rounded bg-white">
                                            <option>ACTIVE</option>
                                            <option>OUT OF STOCK</option>
                                            <option>DISCONTINUED</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">MRP (₹)</label>
                                        <input required type="number" min="0" value={formData.mrp} onChange={e => setFormData({...formData, mrp: e.target.value})} className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">Initial Stock</label>
                                        <input required type="number" min="0" value={formData.stock} onChange={e => setFormData({...formData, stock: e.target.value})} className="w-full p-2 border rounded" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full mt-4 bg-brand-blue text-white font-bold py-3 rounded hover:bg-blue-700">Save to Database</button>
                            </form>
                        </Modal>
                    )}

                    <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-[#fbfbfb]">
                                    <tr>
                                        {['Book Name', 'ERP ID', 'MRP', 'Stock', 'Live Status', 'Actions'].map(h => (
                                            <th key={h} className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-widest">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {skus.length === 0 ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-gray-400">No SKUs in database. Add one to begin.</td></tr>
                                    ) : skus.map((sku) => (
                                        <tr key={sku.docId} className="hover:bg-gray-50/50 transition-colors">
                                            <td className="px-6 py-4 text-sm font-semibold text-gray-900 max-w-[250px] truncate" title={sku.name}>{sku.name}</td>
                                            <td className="px-6 py-4 text-sm text-gray-500 font-mono tracking-tight">{sku.id}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900 font-medium font-mono">₹{sku.mrp}</td>
                                            <td className="px-6 py-4 text-sm font-bold text-gray-900">{sku.stock}</td>
                                            <td className="px-6 py-4">
                                                <select 
                                                    value={sku.status}
                                                    onChange={(e) => onUpdateStatus(sku.docId, e.target.value)}
                                                    className={`px-2.5 py-1 text-[11px] font-bold rounded-md uppercase tracking-wide border cursor-pointer outline-none transition-colors ${getStatusColor(sku.status)}`}
                                                >
                                                    <option value="ACTIVE">ACTIVE</option>
                                                    <option value="OUT OF STOCK">OUT OF STOCK</option>
                                                    <option value="DISCONTINUED">DISCONTINUED</option>
                                                </select>
                                            </td>
                                            <td className="px-6 py-4 text-sm">
                                                <button onClick={() => onDelete(sku.docId)} className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="Delete">
                                                    <Icons.Trash />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const SampleRequestsView = ({ currentSubView, setSubView, requests, onAddRequest, onUpdateStatus, onDelete }) => {
            const tabs = ['All Requests', 'ZM PENDING', 'OPS APPROVED', 'B2B APP UPLOADED', 'DISPATCHED', 'DELIVERED'];
            const [showAdd, setShowAdd] = React.useState(false);
            const [formData, setFormData] = React.useState({ recipient: '', employee: '', books: '', amount: '', status: 'ZM PENDING' });

            const handleSubmit = (e) => {
                e.preventDefault();
                // Auto generate a random order ID for realism
                const generatedId = `SP-ORD-${Math.floor(Math.random() * 90000) + 10000}`;
                onAddRequest({
                    id: generatedId,
                    recipient: formData.recipient,
                    employee: formData.employee,
                    books: Number(formData.books),
                    amount: `₹${Number(formData.amount).toLocaleString()}`,
                    status: formData.status
                });
                setShowAdd(false);
                setFormData({ recipient: '', employee: '', books: '', amount: '', status: 'ZM PENDING' });
            };

            const getStatusColor = (status) => {
                const colors = {
                    'ACTIVE': 'bg-green-50 text-green-700 border-green-200',
                    'ZM PENDING': 'bg-yellow-50 text-yellow-700 border-yellow-200',
                    'OPS APPROVED': 'bg-blue-50 text-blue-700 border-blue-200',
                    'DISPATCHED': 'bg-orange-50 text-orange-700 border-orange-200',
                    'DELIVERED': 'bg-green-50 text-green-700 border-green-200',
                    'ZM DECLINED': 'bg-gray-100 text-gray-700 border-gray-200',
                    'B2B APP UPLOADED': 'bg-purple-50 text-purple-700 border-purple-200'
                };
                return colors[status] || 'bg-gray-100 text-gray-700 border-gray-200';
            };

            const filteredRequests = requests.filter(r => currentSubView === 'All Requests' || r.status === currentSubView);

            return (
                <div className="space-y-6 animate-fade-in pb-10 h-full flex flex-col">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-900">Live Sample Requests</h2>
                        <button onClick={() => setShowAdd(true)} className="flex items-center px-4 py-2 bg-brand-blue text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm transition">
                            + Log Request
                        </button>
                    </div>

                    {showAdd && (
                        <Modal title="Log New Sample Request" onClose={() => setShowAdd(false)}>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">Recipient Name</label>
                                    <input required value={formData.recipient} onChange={e => setFormData({...formData, recipient: e.target.value})} className="w-full p-2 border rounded" placeholder="Teacher / School Name" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">Requesting Employee</label>
                                    <input required value={formData.employee} onChange={e => setFormData({...formData, employee: e.target.value})} className="w-full p-2 border rounded" placeholder="Sales Rep Name" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">Number of Books</label>
                                        <input required type="number" min="1" value={formData.books} onChange={e => setFormData({...formData, books: e.target.value})} className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">Total Value (₹)</label>
                                        <input required type="number" min="0" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full p-2 border rounded" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">Initial Status</label>
                                    <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full p-2 border rounded bg-white">
                                        <option value="ZM PENDING">ZM PENDING</option>
                                        <option value="OPS APPROVED">OPS APPROVED</option>
                                    </select>
                                </div>
                                <button type="submit" className="w-full mt-4 bg-brand-blue text-white font-bold py-3 rounded hover:bg-blue-700">Submit Request</button>
                            </form>
                        </Modal>
                    )}
                    
                    <div className="flex gap-2 border-b border-gray-200 pb-2 overflow-x-auto">
                        {tabs.map(tab => (
                            <button 
                                key={tab} 
                                onClick={() => setSubView(tab)}
                                className={`px-4 py-2 text-sm font-medium rounded-full whitespace-nowrap transition-colors ${currentSubView === tab ? 'bg-brand-blue text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'}`}
                            >
                                {tab} ({requests.filter(r => tab === 'All Requests' || r.status === tab).length})
                            </button>
                        ))}
                    </div>

                    <div className="bg-white border border-gray-200 rounded-xl shadow-sm flex-1 flex flex-col overflow-hidden">
                        <div className="overflow-x-auto flex-1">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-[#fbfbfb]">
                                    <tr>
                                        {['Order ID', 'Recipient', 'Employee', 'Books', 'Amount', 'Live Status', 'Actions'].map((h) => (
                                            <th key={h} className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-widest">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {filteredRequests.length === 0 ? (
                                        <tr><td colSpan="7" className="p-8 text-center text-gray-400">No requests found in this category.</td></tr>
                                    ) : filteredRequests.map((req) => (
                                        <tr key={req.docId} className="hover:bg-gray-50/50 transition-colors">
                                            <td className="px-6 py-4 text-sm font-medium text-gray-500 font-mono">{req.id}</td>
                                            <td className="px-6 py-4 text-sm font-semibold text-gray-900">{req.recipient}</td>
                                            <td className="px-6 py-4 text-sm text-gray-500">{req.employee}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900 font-medium">{req.books}</td>
                                            <td className="px-6 py-4 text-sm text-gray-900 font-mono">{req.amount}</td>
                                            <td className="px-6 py-4">
                                                <select 
                                                    value={req.status}
                                                    onChange={(e) => onUpdateStatus(req.docId, e.target.value)}
                                                    className={`px-2.5 py-1 text-[11px] font-bold rounded-md uppercase tracking-wide border cursor-pointer outline-none transition-colors ${getStatusColor(req.status)}`}
                                                >
                                                    <option value="ZM PENDING">ZM PENDING</option>
                                                    <option value="ZM DECLINED">ZM DECLINED</option>
                                                    <option value="OPS APPROVED">OPS APPROVED</option>
                                                    <option value="B2B APP UPLOADED">B2B APP UPLOADED</option>
                                                    <option value="DISPATCHED">DISPATCHED</option>
                                                    <option value="DELIVERED">DELIVERED</option>
                                                </select>
                                            </td>
                                            <td className="px-6 py-4 text-sm">
                                                <button onClick={() => onDelete(req.docId)} className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="Delete">
                                                    <Icons.Trash />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [fbReady, setFbReady] = React.useState(false);
            const [db, setDb] = React.useState(null);
            const [user, setUser] = React.useState(null);

            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [currentView, setCurrentView] = React.useState('dashboard');
            const [currentSubView, setSubView] = React.useState('All Requests');

            const [skus, setSkus] = React.useState([]);
            const [requests, setRequests] = React.useState([]);

            // Firebase Bootstrapper
            React.useEffect(() => {
                const initTimer = setInterval(async () => {
                    if (window.FB) {
                        clearInterval(initTimer);
                        try {
                            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.FB;
                            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "live-crm" };
                            const app = initializeApp(config);
                            const fbAuth = getAuth(app);
                            const firestore = getFirestore(app);

                            if (typeof __initial_auth_token !== 'undefined') {
                                await signInWithCustomToken(fbAuth, __initial_auth_token);
                            } else {
                                await signInAnonymously(fbAuth);
                            }

                            setDb(firestore);
                            setUser(fbAuth.currentUser);
                            setFbReady(true);
                        } catch (err) {
                            console.error("Firebase Auth Error:", err);
                        }
                    }
                }, 50);
                return () => clearInterval(initTimer);
            }, []);

            // Firebase Live Data Subscriptions
            React.useEffect(() => {
                if (!fbReady || !db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                const { collection, onSnapshot } = window.FB;

                const unsubSkus = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'skus'), (snap) => {
                    const data = [];
                    snap.forEach(doc => data.push({ docId: doc.id, ...doc.data() }));
                    // Sort alphabetically by name
                    data.sort((a,b) => a.name.localeCompare(b.name));
                    setSkus(data);
                }, (err) => console.error(err));

                const unsubReqs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), (snap) => {
                    const data = [];
                    snap.forEach(doc => data.push({ docId: doc.id, ...doc.data() }));
                    // Sort newest first
                    data.sort((a,b) => b.createdAt - a.createdAt);
                    setRequests(data);
                }, (err) => console.error(err));

                return () => { unsubSkus(); unsubReqs(); };
            }, [fbReady, db, user]);

            const handleAddSKU = async (skuData) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.addDoc(window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'skus'), skuData);
            };

            const handleUpdateSKU = async (docId, newStatus) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.updateDoc(window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'skus', docId), { status: newStatus });
            };

            const handleDeleteSKU = async (docId) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.deleteDoc(window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'skus', docId));
            };

            const handleAddRequest = async (reqData) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.addDoc(window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'requests'), { 
                    ...reqData, 
                    createdAt: Date.now() 
                });
            };

            const handleUpdateRequest = async (docId, newStatus) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.updateDoc(window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'requests', docId), { status: newStatus });
            };

            const handleDeleteRequest = async (docId) => {
                if(!db || !user) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-crm-app';
                await window.FB.deleteDoc(window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'requests', docId));
            };


            if (!fbReady) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-gray-50 text-gray-500 font-medium">
                        <div className="w-8 h-8 border-4 border-brand-blue border-t-transparent rounded-full animate-spin mb-4"></div>
                        Connecting to Secure Live Servers...
                    </div>
                );
            }

            if (!isLoggedIn) {
                return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
            }

            const NavItem = ({ id, icon: Icon, label, badge, indent = false }) => (
                <li>
                    <button 
                        onClick={() => setCurrentView(id)}
                        className={`w-full flex items-center justify-between px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${indent ? 'pl-10' : ''} ${
                            currentView === id 
                            ? 'bg-[#eef2ff] text-[#2557D6] shadow-sm ring-1 ring-[#e0e7ff]' 
                            : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'
                        }`}
                    >
                        <div className="flex items-center">
                            {!indent && Icon && <span className={`mr-3 ${currentView === id ? 'text-[#2557D6]' : 'text-gray-400'}`}><Icon /></span>}
                            {label}
                        </div>
                        {badge > 0 && (
                            <span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full">{badge}</span>
                        )}
                    </button>
                </li>
            );

            return (
                <div className="flex h-screen bg-[#f6f6f5] font-sans text-gray-900 overflow-hidden">
                    <aside className="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0 z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                        <div className="h-20 flex items-center px-6 border-b border-gray-100">
                            <div className="w-9 h-9 bg-brand-blue rounded-lg flex items-center justify-center text-white font-bold text-sm mr-3 shadow-md ring-2 ring-blue-100 relative overflow-hidden">
                                <div className="absolute inset-0 bg-white/20 blur-sm"></div>
                                <span className="relative z-10">SP</span>
                            </div>
                            <div className="flex flex-col">
                                <span className="font-bold text-gray-900 text-[15px] leading-tight tracking-tight">Sawrsawti Publ.</span>
                                <span className="text-[10px] text-green-600 bg-green-50 px-1.5 py-0.5 rounded uppercase font-bold tracking-wider mt-0.5 w-fit flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Live System
                                </span>
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-6">
                            <ul className="space-y-1">
                                <NavItem id="dashboard" icon={Icons.Dashboard} label="Dashboard" />
                            </ul>

                            <div>
                                <div className="px-4 mb-2 flex items-center justify-between text-xs font-bold text-gray-400 uppercase tracking-widest">
                                    Inventory Management
                                </div>
                                <ul className="space-y-1">
                                    <NavItem id="sku-list" icon={Icons.Inventory} label="SKU Master List" badge={skus.length} />
                                </ul>
                            </div>

                            <div>
                                <div className="px-4 mb-2 flex items-center justify-between text-xs font-bold text-gray-400 uppercase tracking-widest">
                                    Fulfillment Desk
                                </div>
                                <ul className="space-y-1 relative before:content-[''] before:absolute before:left-[22px] before:top-4 before:bottom-4 before:w-[1px] before:bg-gray-200">
                                    <NavItem id="sample-requests-all" label="Overview Board" indent={true} />
                                </ul>
                            </div>
                        </nav>

                        <div className="p-4 border-t border-gray-100 bg-[#fafafa]">
                            <div className="flex flex-col">
                                <p className="text-sm font-semibold text-gray-900 truncate">rohit.ops@saraswati...</p>
                                <div className="flex justify-between items-center mt-1">
                                    <p className="text-xs font-bold text-gray-400 uppercase tracking-wide">Authorized Ops</p>
                                    <button onClick={() => setIsLoggedIn(false)} className="text-xs font-medium text-gray-500 hover:text-red-600 transition-colors">Logout</button>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <div className="flex-1 overflow-y-auto p-6 md:p-10">
                            <div className="max-w-[1400px] mx-auto h-full">
                                {currentView === 'dashboard' && <DashboardView requests={requests} />}
                                {currentView === 'sku-list' && (
                                    <SKUListView 
                                        skus={skus} 
                                        onAddSKU={handleAddSKU} 
                                        onUpdateStatus={handleUpdateSKU} 
                                        onDelete={handleDeleteSKU} 
                                    />
                                )}
                                {currentView.startsWith('sample-requests') && (
                                    <SampleRequestsView 
                                        currentSubView={currentSubView} 
                                        setSubView={setSubView} 
                                        requests={requests}
                                        onAddRequest={handleAddRequest}
                                        onUpdateStatus={handleUpdateRequest}
                                        onDelete={handleDeleteRequest}
                                    />
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
